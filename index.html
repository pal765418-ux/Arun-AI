
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arun AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#18243a;padding:20px;
 text-align:center;border-bottom:1px solid #34445e;
}
header h1{color:#55c8ff;margin:0}
header p{color:#bbcce0}
main{max-width:750px;margin:auto;padding:15px}
#chat{
 height:65vh;min-height:300px;overflow-y:auto;
 background:#18243a;border-radius:15px;padding:12px;
}
.msg{
 padding:12px;margin:10px 0;border-radius:12px;
 line-height:1.6;white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.user{background:#087dbb;margin-left:15%}
.bot{background:#34445e;margin-right:15%}
form{display:flex;gap:8px;margin-top:12px}
input{
 flex:1;min-width:0;padding:14px;
 border:0;border-radius:10px;font-size:16px;
}
button{
 border:0;border-radius:10px;padding:12px 17px;
 background:#08a5ed;color:white;font-size:16px;
}
button:disabled{opacity:.5}
#status{color:#aab8cc;padding:8px;font-size:13px}
</style>
</head>
<body>

<header>
<h1>🤖 Arun AI</h1>
<p>Your Personal AI Assistant ❤️</p>
</header>

<main>
<div id="chat">
<div class="msg bot">
नमस्ते भाई! ❤️ मैं Arun AI हूँ।
मुझसे कोई भी सवाल पूछिए।
</div>
</div>

<div id="status">Arun AI तैयार है</div>

<form id="form">
<input id="question" placeholder="अपना सवाल लिखें..." autocomplete="off">
<button id="send">Send</button>
</form>
</main>

<script>
const chat=document.getElementById("chat");
const form=document.getElementById("form");
const input=document.getElementById("question");
const status=document.getElementById("status");
const send=document.getElementById("send");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async function(e){
 e.preventDefault();

 const message=input.value.trim();
 if(!message)return;

 addMessage(message,"user");
 input.value="";
 send.disabled=true;
 status.textContent="Arun AI सोच रहा है...";

 try{
  const response=await fetch(
   "/.netlify/functions/chat",
   {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message})
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error||"AI connection failed");
  }

  addMessage(data.answer||"जवाब नहीं मिला","bot");
  status.textContent="Arun AI तैयार है ❤️";

 }catch(error){
  addMessage(
   "भाई, अभी AI Server से कनेक्शन नहीं हुआ। Backend सेट होने के बाद मैं जवाब दे पाऊँगा।",
   "bot"
  );
  status.textContent="Server connection नहीं हुआ";
 }finally{
  send.disabled=false;
  input.focus();
 }
});
</script>

</body>
</html>
